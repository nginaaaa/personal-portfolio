<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html>
<head>
    <title>ABC College Portal</title>
</head>
<!-- Split screen vertically: Top (15%), Middle (* remaining), Bottom (10%) -->
<frameset rows="15%, *, 10%" frameborder="1" border="2">
    
    <!-- Top Header Frame -->
    <frame src="header.html" name="headerFrame" scrolling="no" noresize="noresize" />
    
    <!-- Middle Section: Split horizontally into Left Menu (20%) and Right Content (80%) -->
    <frameset cols="20%, 80%">
        <frame src="menu.html" name="menuFrame" scrolling="auto" />
        <!-- Default page loaded in the main content area -->
        <frame src="home.html" name="contentFrame" scrolling="auto" />
    </frameset>
    
    <!-- Bottom Footer Frame -->
    <frame src="footer.html" name="footerFrame" scrolling="no" noresize="noresize" />

    <noframes>
        <body>
            <p>Your browser does not support frames. Please update your browser to view the ABC College Portal.</p> 
        </body>
    </noframes> 
    </frameset>
</html>
