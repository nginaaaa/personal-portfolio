<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Frame Area */
        header {
            background-color: #003366;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Container for Menu + Content */
        .main-container {
            display: flex;
            flex: 1;
        }

        /* Left Menu Frame Area */
        nav {
            width: 200px;
            background-color: #f4f4f4;
            padding: 20px;
            border-right: 2px solid #ccc;
        }

        nav h3 {
            margin-bottom: 15px;
            color:#333;
        }   
        nav ul {
            list-style: none;
        }

        nav ul li {
            margin-bottom: 12px;
        }

        nav ul li a {
            text-decoration: none;
            color: #003366;
            font-weight: bold;
            display: block;
            padding: 8px;
            border-radius: 4px;
        }

        nav ul li a:hover {
            background-color: #003366;
            color: white;
        }

        /* Main Content Frame Area */
        main {
            flex: 1;
            padding: 25px;
            background-color: #ffffff;
        }

        /* Footer Frame Area */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header Frame -->
    <header>
        <h1>ABC COLLEGE</h1>
    </header>

    <!-- Middle Section: Menu & Content -->
    <div class="main-container">
        <!-- Menu Frame -->
        <nav>
            <h3>MENU</h3>
            <ul>
                <li><a href="#" onclick="showSection('home')">Home</a></li>
                <li><a href="#" onclick="showSection('courses')">Courses</a></li>
                <li><a href="#" onclick="showSection('departments')">Departments</a></li>
                <li><a href="#" onclick="showSection('contact')">Contact</a></li>
            </ul>
        </nav>

        <!-- Content Frame -->
        <main id="contentFrame">
            <h2>Welcome to ABC College</h2>
            <p>Select an option from the left navigation menu to view details about our college, courses, departments, and contact information.</p>
        </main>

    </div>

    <!-- Footer Frame -->
    <footer>
        <p>&copy; 2026 ABC College. All Rights Reserved.</p>
    </footer>

    <!-- Interactive Script to switch pages without reloading -->
    <script>
        const pages = {
            home: `<h2>Welcome to ABC College</h2><p>Select an option from the left navigation menu to view details about our college, courses, departments, and contact information.</p>`,
            courses: `<h2>Our Courses</h2><p>We offer undergraduate and postgraduate degrees in Computer Science, Business Administration, Engineering, and Arts.</p>`,
            departments: `<h2>Academic Departments</h2><p>Explore our departments: School of Engineering, Department of Computer Science, School of Business, and Department of Humanities.</p>`,
            contact: `<h2>Contact Us</h2><p>Email: info@abccollege.edu<br>Phone: +1 800-123-4567<br>Address: 123 Campus Drive, University City</p>`
        };

        function showSection(sectionKey) {
            document.getElementById('contentFrame').innerHTML = pages[sectionKey];
        }
    </script>

</body>
</html>
